name: Image

# Builds the container image on every pull request and runs it once, and
# pushes it to ghcr.io/jmineau/pystiltctl: as `main` from main, and as the
# version (and `latest`) from a vX.Y.Z tag.

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:  # any base, so a PR stacked on another PR is checked too
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  IMAGE: ghcr.io/${{ github.repository }}

jobs:
  image:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write  # push to ghcr.io
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          fetch-depth: 0  # setuptools-scm reads the version from tags

      - uses: astral-sh/setup-uv@v10.2.0
        with:
          version: "0.12.23"

      - name: Version
        id: version
        run: echo "version=$(uv run --no-project --with 'setuptools-scm>=8' python -m setuptools_scm)" >> "$GITHUB_OUTPUT"

      - name: Build
        run: docker build --build-arg "VERSION=$VERSION" -t pystiltctl .
        env:
          VERSION: ${{ steps.version.outputs.version }}

      - name: Run a task of an empty project
        # stilt init makes a project with no receptors, so the task has
        # nothing to run and exits 0: this checks the image's whole chain,
        # tini to pystiltctl to stilt, without meteorology.
        run: |
          docker run --rm pystiltctl sh -c '
            set -e
            pystiltctl --help > /dev/null
            stilt init /tmp/demo > /dev/null
            pystiltctl push /tmp/demo /tmp/bucket/demo
            pystiltctl worker file:///tmp/bucket/demo --tasks 2 --index 1
          '

      - name: Push
        if: github.event_name == 'push'
        run: |
          echo "$TOKEN" | docker login ghcr.io -u "$ACTOR" --password-stdin
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            tags="$VERSION latest"
          else
            tags="main"
          fi
          for tag in $tags; do
            docker tag pystiltctl "$IMAGE:$tag"
            docker push "$IMAGE:$tag"
          done
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ACTOR: ${{ github.actor }}
          VERSION: ${{ steps.version.outputs.version }}
